version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install
      - run: npm run build
      - run:
          name: Start app in background
          command: npm run start -- --hostname 0.0.0.0 &
      - run:
          name: Wait for app to start
          command: sleep 30
      - run:
          name: Verbose curl to check app (ignore cert)
          command: |
            curl -vk --retry 10 --retry-delay 5 --retry-all-errors --max-time 5 https://localhost:3000/ || {
              echo "curl failed after multiple retries. Printing netstat and logs:";
              netstat -tulpn || true;
              cat ./logs/* || true;
              exit 1;
            }

  snyk-test:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install snyk
      - run: npx snyk auth $SNYK_TOKEN
      - run:
          name: Run Snyk Test
          command: npx snyk test

  zap-test:
    docker:
      - image: ghcr.io/zaproxy/zaproxy:stable
    steps:
      - checkout
      - run:
          name: Start OWASP ZAP API Security Scan
          command: |
            zap.sh -cmd -quickurl https://localhost:3000/api/auth/signin -quickprogress -quickout /tmp/zap_signin_report.html
            zap.sh -cmd -quickurl https://localhost:3000/api/auth/session -quickprogress -quickout /tmp/zap_session_report.html
            zap.sh -cmd -quickurl https://localhost:3000/api/auth/signout -quickprogress -quickout /tmp/zap_signout_report.html
      - store_artifacts:
          path: /tmp/zap_signin_report.html
          destination: zap_signin_report.html
      - store_artifacts:
          path: /tmp/zap_session_report.html
          destination: zap_session_report.html
      - store_artifacts:
          path: /tmp/zap_signout_report.html
          destination: zap_signout_report.html

workflows:
  version: 2
  security-workflow:
    jobs:
      - build
      - snyk-test:
          requires:
            - build
      - zap-test:
          requires:
            - build
