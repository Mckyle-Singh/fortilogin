version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install
      - run: npm run build

  dependency-check:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: mkdir -p odc-data odc-report
      - setup_remote_docker
      - run:
          name: Run OWASP Dependency-Check
          command: |
            docker run --rm \
              -v "$(pwd):/project" \
              -v "$(pwd)/odc-data:/usr/share/dependency-check/data" \
              -v "$(pwd)/odc-report:/report" \
              owasp/dependency-check \
              --scan /project \
              --format "HTML" \
              --out /report
      - store_artifacts:
          path: odc-report
          destination: dependency-check-report

workflows:
  version: 2
  build-workflow:
    jobs:
      - build
      - dependency-check
