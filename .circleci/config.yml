version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install
      - run: npm run build

  dependency-check:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: mkdir -p odc-data odc-report
      - run:
          name: Show current directory and check for app/package.json
          command: |
            echo "Current directory: $(pwd)"
            ls -lah
            if [ -f app/package.json ]; then
              echo "app/package.json found!"
            else
              echo "app/package.json NOT found!"
              exit 1
            fi
      - setup_remote_docker
      - run:
          name: Pull OWASP Dependency-Check image
          command: docker pull owasp/dependency-check:latest
      - run:
          name: Run OWASP Dependency-Check on app/package.json
          command: |
            docker run --rm \
              -v "$(pwd):/project" \
              -v "$(pwd)/odc-data:/usr/share/dependency-check/data" \
              -v "$(pwd)/odc-report:/report" \
              owasp/dependency-check:latest \
              --scan /project/app/package.json \
              --format "HTML" \
              --out /report
      - store_artifacts:
          path: odc-report
          destination: dependency-check-report

workflows:
  version: 2
  build-workflow:
    jobs:
      - build
      - dependency-check
