version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install
      - run: npm run build

  dependency-check:
    machine: true
    working_directory: ~/project
    steps:
      - checkout
      - run: mkdir -p odc-data odc-report
      - run:
          name: Show current directory and check for app/page.tsx
          command: |
            echo "Current directory: $(pwd)"
            ls -lah app
            if [ -f app/page.tsx ]; then
              echo "app/page.tsx found!"
            else
              echo "app/page.tsx NOT found!"
              exit 1
            fi
      - run: docker pull owasp/dependency-check:latest
      - run: |
          docker run --rm \
            -v $(pwd):/project \
            -v $(pwd)/odc-data:/usr/share/dependency-check/data \
            -v $(pwd)/odc-report:/report \
            owasp/dependency-check:latest \
            --project "nextjs-owasp" \
            --scan /project/package.json \
            --format "HTML" \
            --out /report
      - store_artifacts:
          path: odc-report
          destination: dependency-check-report

workflows:
  version: 2
  build-workflow:
    jobs:
      - build
      - dependency-check
