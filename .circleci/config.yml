version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: npm install
      - run: npm run build

  snyk-test:
    docker:
      - image: cimg/node:20.11.1
    steps:
      - checkout
      - run: sudo npm install -g snyk
      - run: snyk auth $SNYK_TOKEN
      - run:
          name: Run Snyk Test
          command: snyk test

workflows:
  version: 2
  build-workflow:
    jobs:
      - build
      - snyk-test:
          requires:
            - build
