version: 2.1
executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.2
    working_directory: ~/project
  zap-executor:
    docker:
      - image: owasp/zap2docker-stable
    working_directory: ~/project
jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Build the app
          command: npm run build
  zap-test:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Start app in background
          command: npm run dev &
      - run:
          name: Wait for app to be ready
          command: sleep 10
      - run:
          name: Run ZAP scan against HTTPS
          command: |
            docker run --network host --rm owasp/zap2docker-stable zap-baseline.py -t https://localhost:3000 -r zap_report.html || true
      - store_artifacts:
          path: zap_report.html
          destination: zap_report.html
workflows:
  version: 2
  build_and_scan:
    jobs:
      - build
      - zap-test:
          requires:
            - build