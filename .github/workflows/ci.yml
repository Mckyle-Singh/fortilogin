name: CI Pipeline
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }} # ✅ Add Database URL
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }} # ✅ Add NextAuth Secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run lint checks
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --passWithNoTests --coverage

      - name: Show coverage folder contents
        run: ls -R coverage/

      - name: Build Next.js project
        run: npm run build

      - name: Confirm coverage folder contents before upload
        run: ls -lR coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/

  sonar-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install SonarQube Scanner
        run: npm install -g sonarqube-scanner

      - name: Run SonarQube Analysis
        run: >
          sonar-scanner
          -Dsonar.projectKey=Mckyle-Singh_fortilogin
          -Dsonar.organization=mckyle-singh
          -Dsonar.sources=.
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          


