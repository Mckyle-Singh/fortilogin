name: CI Pipeline
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }} # ✅ Add Database URL
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }} # ✅ Add NextAuth Secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Next.js project
        run: npm run build

  sonar-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install SonarQube Scanner
        run: npm install -g sonarqube-scanner

      - name: Run SonarQube Analysis
        run: >
          sonar-scanner
          -Dsonar.projectKey=Mckyle-Singh_fortilogin
          -Dsonar.organization=mckyle-singh
          -Dsonar.sources=.
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.coverage.exclusions=**/*.ts  # Ignore TypeScript files for coverage



