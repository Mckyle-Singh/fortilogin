name: CI Pipeline
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }} # ✅ Add Database URL
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }} # ✅ Add NextAuth Secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Next.js project
        run: npm run build